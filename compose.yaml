services:
  app:
    profiles: ["production"]
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgres://exitkeeper:exitkeeper@postgres:5432/exitkeeper
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://ethereum-hoodi-rpc.publicnode.com}
      KEEPERHUB_API_KEY: ${KEEPERHUB_API_KEY:-}
      KEEPERHUB_BASE_URL: ${KEEPERHUB_BASE_URL:-https://app.keeperhub.com}
      WAYFINDER_SERVICE_TOKEN: ${WAYFINDER_SERVICE_TOKEN:-local-development-only}
      WAYFINDER_SERVICE_URL: http://wayfinder:8090
    depends_on:
      migrate:
        condition: service_completed_successfully
      wayfinder:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  migrate:
    profiles: ["production"]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://exitkeeper:exitkeeper@postgres:5432/exitkeeper
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exitkeeper
      POSTGRES_PASSWORD: exitkeeper
      POSTGRES_USER: exitkeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exitkeeper -d exitkeeper"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - exitkeeper-postgres:/var/lib/postgresql/data

  wayfinder:
    build:
      context: ./services/wayfinder
    environment:
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      WAYFINDER_SERVICE_TOKEN: ${WAYFINDER_SERVICE_TOKEN:-local-development-only}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  exitkeeper-postgres:
